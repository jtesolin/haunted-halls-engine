name: Engine CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Engine / Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Ruff
        run: python -m ruff check .

  typecheck:
    name: Engine / Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8.0.0"

      - name: Run Pyright
        run: python -m pyright

  tests:
    name: Engine / Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8.0.0"

      - name: Run pytest
        run: python -m pytest

  postgres-tests:
    name: Engine / PostgreSQL Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: haunted_halls_ci
          POSTGRES_USER: haunted_halls_ci
          POSTGRES_PASSWORD: haunted_halls_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U haunted_halls_ci -d haunted_halls_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://haunted_halls_ci:haunted_halls_ci@127.0.0.1:5432/haunted_halls_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8.0.0"

      - name: Run PostgreSQL migration
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head
          DATABASE_URL="$TEST_DATABASE_URL" alembic current

      - name: Run pytest against PostgreSQL
        run: TEST_DATABASE_URL="$TEST_DATABASE_URL" python -m pytest

  migrations:
    name: Engine / Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: haunted_halls_migration_ci
          POSTGRES_USER: haunted_halls_ci
          POSTGRES_PASSWORD: haunted_halls_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U haunted_halls_ci -d haunted_halls_migration_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://haunted_halls_ci:haunted_halls_ci@127.0.0.1:5432/haunted_halls_migration_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check for single Alembic head
        run: |
          heads=$(alembic heads | wc -l)
          if [ $heads -ne 1 ]; then
            echo "ERROR: Expected 1 migration head, found $heads"
            alembic heads
            exit 1
          fi

      - name: Upgrade fresh SQLite database
        run: |
          DATABASE_URL=sqlite:////tmp/haunted-halls-ci.db alembic upgrade head
          DATABASE_URL=sqlite:////tmp/haunted-halls-ci.db alembic current

      - name: Upgrade fresh PostgreSQL database
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head
          DATABASE_URL="$TEST_DATABASE_URL" alembic current

      - name: Check PostgreSQL migration drift
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" alembic check

  docker-build:
    name: Engine / Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --target runner --tag haunted-halls-engine:ci .
